app = "ssa-prod"
primary_region = "syd"

[build]

[env]
  # Same container, so the web app reaches the CMS over localhost.
  CMS_URL = "http://localhost:3001"
  WEB_URL = "https://ssa-prod.fly.dev"
  # Must also be registered in Google Cloud Console.
  GOOGLE_OAUTH_REDIRECT_URI = "https://ssa-prod.fly.dev/api/auth/google/callback"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # One path per app, so a dead process fails the deploy instead of 502ing.
  # Neither touches Postgres — a DB outage shouldn't roll back a deploy.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  # nginx plus two Next servers; 256mb OOMs under load.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
