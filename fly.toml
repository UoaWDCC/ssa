app = "ssa-prod"
primary_region = "syd"

[build]

[env]
  # The web app calls the CMS server-side inside the same container.
  CMS_URL = "http://localhost:3001"
  # Public origin, used for Stripe success/cancel redirects and the Google
  # OAuth redirect URI.
  WEB_URL = "https://ssa-prod.fly.dev"
  GOOGLE_OAUTH_REDIRECT_URI = "https://ssa-prod.fly.dev/api/auth/google/callback"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Both apps run in one container behind nginx, so check one path from each:
  # a dead web or CMS process now fails the deploy instead of silently 502ing.
  # Neither path touches Postgres, so a database outage degrades the site
  # rather than rolling back every deploy.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  # nginx + two Next.js standalone servers; 256mb OOMs under load.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
