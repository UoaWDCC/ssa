events {}

http {
  include /etc/nginx/mime.types;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Fall back to what nginx saw when Fly's proxy isn't in front (local runs).
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Next checks Origin against the forwarded host on Server Actions, and Origin
  # includes the port. $host drops it, which fails every action off :80/:443.
  map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
  }

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $forwarded_host;

  server {
    listen 80;

    # The web app owns these /api routes; ^~ matches them before /api -> CMS.
    location ^~ /api/auth {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/checkout {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/about-us {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/signup {
      proxy_pass http://localhost:3000;
    }

    # The CMS builds with assetPrefix=/cms-assets so its chunks don't collide
    # with the web app's /_next; strip the prefix back off before proxying.
    location ^~ /cms-assets/ {
      rewrite ^/cms-assets(/.*)$ $1 break;
      proxy_pass http://localhost:3001;
    }

    # CMS liveness probe (see fly.toml health checks).
    location = /health {
      proxy_pass http://localhost:3001;
    }

    # The only /stripe route reached from outside; the rest are internal.
    location = /stripe/webhook {
      proxy_pass http://localhost:3001;
    }

    # CMS admin panel and Payload REST/GraphQL API
    location /admin {
      proxy_pass http://localhost:3001;
    }

    location /api {
      proxy_pass http://localhost:3001;
    }

    # Everything else goes to web
    location / {
      proxy_pass http://localhost:3000;
    }
  }
}
