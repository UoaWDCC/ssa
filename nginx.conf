events {}

http {
  include /etc/nginx/mime.types;

  # Only send "Connection: upgrade" for actual websocket requests.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Fly's proxy terminates TLS and sets X-Forwarded-Proto; fall back to the
  # scheme nginx saw when the header is absent (e.g. running the image locally).
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Shared proxy settings. X-Forwarded-* let the Next apps reconstruct the
  # public https origin (used for the Google OAuth redirect URI) instead of
  # seeing localhost.
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;

  server {
    listen 80;

    # The web app owns these /api routes, so they must be matched before the
    # generic /api -> CMS rule below (^~ prefixes win over the shorter /api).
    location ^~ /api/auth {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/checkout {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/about-us {
      proxy_pass http://localhost:3000;
    }

    location ^~ /api/signup {
      proxy_pass http://localhost:3000;
    }

    # The CMS builds with assetPrefix=/cms-assets so its chunks don't collide
    # with the web app's /_next; strip the prefix back off before proxying.
    location ^~ /cms-assets/ {
      rewrite ^/cms-assets(/.*)$ $1 break;
      proxy_pass http://localhost:3001;
    }

    # CMS liveness probe (see fly.toml health checks).
    location = /health {
      proxy_pass http://localhost:3001;
    }

    # Stripe posts here from outside; every other /stripe route is called
    # server-side by the web app over localhost and stays unexposed.
    location = /stripe/webhook {
      proxy_pass http://localhost:3001;
    }

    # CMS admin panel and Payload REST/GraphQL API
    location /admin {
      proxy_pass http://localhost:3001;
    }

    location /api {
      proxy_pass http://localhost:3001;
    }

    # Everything else goes to web
    location / {
      proxy_pass http://localhost:3000;
    }
  }
}
